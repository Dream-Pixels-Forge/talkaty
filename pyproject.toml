[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talkaty"
version = "1.2.0"
description = "Terminal-native TTS voiceover tool — script.md to audio in any accent, via CLI or MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dream-Pixels-Forge" }]
keywords = ["cli", "tts", "voiceover", "mcp", "edge-tts", "kittentts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "edge-tts>=6.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
kittentts = ["kittentts>=0.1.0"]
piper = ["piper-tts>=1.8.0", "numpy>=1.24"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
talkaty = "talkaty.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "ASYNC230"]
